name: Public CMS helper tests

on:
  pull_request:
    paths:
      - "src/lib/public-cms*.js"
      - "src/lib/public-cms*.test.js"
      - ".github/workflows/public-cms-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/lib/public-cms*.js"
      - "src/lib/public-cms*.test.js"
      - ".github/workflows/public-cms-tests.yml"

permissions:
  contents: read

jobs:
  public-cms-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run public CMS helper tests
        run: node --test src/lib/public-cms-core.test.js

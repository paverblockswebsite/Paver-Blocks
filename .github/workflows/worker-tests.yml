name: Worker API tests

on:
  push:
    branches:
      - development/site-foundation
    paths:
      - 'worker/**'
      - 'worker-admin/**'
      - '.github/workflows/worker-tests.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'worker-admin/**'
      - '.github/workflows/worker-tests.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Worker tooling
        working-directory: worker
        run: npm install --no-audit --no-fund
      - name: Run Worker smoke tests
        working-directory: worker
        run: npm test
      - name: Validate Wrangler configuration without deploying
        working-directory: worker
        run: npm run check:config
      - name: Install admin gateway tooling
        working-directory: worker-admin
        run: npm install --no-audit --no-fund
      - name: Run admin gateway smoke tests
        working-directory: worker-admin
        run: npm test
      - name: Validate admin gateway Wrangler configuration without deploying
        working-directory: worker-admin
        run: npm run check:config

name: Worker API tests

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/worker-tests.yml'

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Worker smoke tests
        working-directory: worker
        run: npm test
